<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canivete Suíço • 7 Ferramentas</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --surface: #ffffff;
            --primary: #4f6ef7;
            --primary-hover: #3b54db;
            --danger: #e74c3c;
            --success: #2ecc71;
            --text: #1a1a2e;
            --text-light: #555;
            --border: #e0e0e0;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #e8ecf1 0%, #dce3ea 50%, #f0f2f5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        /* Ícone WhatsApp flutuante */
        .whatsapp-float {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            width: 52px;
            height: 52px;
            background: #25D366;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            animation: pulse 2s infinite;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
        }

        .whatsapp-float svg {
            width: 28px;
            height: 28px;
            fill: #fff;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.5);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(37, 211, 102, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
            }
        }

        .swiss-knife {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            border-radius: 24px;
            box-shadow: var(--shadow), 0 0 0 1px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            animation: fadeInUp 0.5s ease;
            position: relative;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #4f6ef7 0%, #6c5ce7 100%);
            color: #fff;
            padding: 16px 20px 12px;
            text-align: center;
            position: relative;
        }

        .header .logo-icon {
            font-size: 1.8rem;
            display: block;
            margin-bottom: 2px;
        }

        .header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .header p {
            font-size: 0.75rem;
            opacity: 0.85;
            margin-top: 2px;
        }

        /* WhatsApp no header (alternativa caso queira dentro) */
        .header-whatsapp {
            position: absolute;
            top: 12px;
            right: 14px;
            width: 38px;
            height: 38px;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .header-whatsapp:hover {
            transform: scale(1.1);
        }
        .header-whatsapp svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }

        .tabs {
            display: flex;
            background: #f8f9fb;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .tab-btn {
            flex: 1 0 auto;
            padding: 12px 6px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--text-light);
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            white-space: nowrap;
        }

        .tab-btn .tab-icon {
            font-size: 1.1rem;
        }

        .tab-btn.active {
            color: var(--primary);
            background: #fff;
            position: relative;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 3px;
            background: var(--primary);
            border-radius: 3px 3px 0 0;
        }

        .tab-btn:hover:not(.active) {
            color: #444;
            background: rgba(79, 110, 247, 0.03);
        }

        .tool-content {
            padding: 20px 24px 28px;
            min-height: 420px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tool-panel {
            display: none;
        }
        .tool-panel.active {
            display: block;
        }

        /* ===== TO-DO LIST ===== */
        .todo-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .todo-input-group input {
            flex: 1;
            padding: 13px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            outline: none;
            background: #fafbfc;
            color: var(--text);
        }

        .todo-input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 110, 247, 0.08);
            background: #fff;
        }

        .btn-add {
            padding: 13px 20px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .btn-add:hover {
            background: var(--primary-hover);
        }

        .todo-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: #fafbfc;
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .todo-item.completed {
            opacity: 0.55;
            background: #f5f6f8;
        }
        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #999;
        }

        .todo-checkbox {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #ccd;
            appearance: none;
            cursor: pointer;
            position: relative;
            background: #fff;
            flex-shrink: 0;
        }

        .todo-checkbox:checked {
            background: var(--success);
            border-color: var(--success);
        }
        .todo-checkbox:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-weight: bold;
        }

        .todo-text {
            flex: 1;
            font-size: 0.95rem;
            color: var(--text);
            word-break: break-word;
        }

        .btn-delete {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: #ccc;
            padding: 6px 8px;
            border-radius: 6px;
        }
        .btn-delete:hover {
            color: var(--danger);
            background: rgba(231, 76, 60, 0.08);
        }

        .export-buttons {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            justify-content: center;
        }

        .btn-export {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition);
            background: #ecfdf5;
            color: #047857;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-export:hover {
            background: #d1fae5;
            transform: translateY(-1px);
        }

        /* ===== CALCULADORA ===== */
        .calculator {
            background: #f8f9fb;
            border-radius: var(--radius);
            padding: 16px;
        }

        .calc-display {
            background: #1e1e2e;
            color: #fff;
            border-radius: var(--radius-sm);
            padding: 18px 20px;
            text-align: right;
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            min-height: 70px;
            margin-bottom: 14px;
            word-break: break-all;
            font-family: 'SF Mono', 'Consolas', monospace;
        }

        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .calc-btn {
            padding: 16px 8px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            background: #fff;
            color: var(--text);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }
        .calc-btn:hover {
            background: #f0f2f8;
            transform: translateY(-2px);
        }
        .calc-btn:active {
            transform: scale(0.94);
        }
        .calc-btn.operator {
            background: #edf0ff;
            color: var(--primary);
        }
        .calc-btn.equal {
            background: var(--primary);
            color: #fff;
        }
        .calc-btn.clear {
            background: #fff0f0;
            color: var(--danger);
        }
        .calc-btn.zero {
            grid-column: span 2;
        }

        /* ===== CONVERSORES (Capacitância, Resistência) ===== */
        .converter-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .converter-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .converter-row label {
            width: 50px;
            font-weight: 600;
            color: var(--text);
            font-size: 0.95rem;
            text-align: right;
            flex-shrink: 0;
        }

        .converter-row input {
            flex: 1;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            outline: none;
            background: #fafbfc;
            color: var(--text);
            transition: all var(--transition);
        }

        .converter-row input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 110, 247, 0.1);
            background: #fff;
        }

        .converter-row input::placeholder {
            color: #ccc;
            font-size: 0.85rem;
        }

        .converter-note {
            font-size: 0.8rem;
            color: #888;
            text-align: center;
            margin-top: 8px;
        }

        /* ===== CONVERSOR DE MEDIDAS ===== */
        .measure-converter {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .converter-section {
            background: #f8f9fb;
            border-radius: var(--radius-sm);
            padding: 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 12px;
        }

        .converter-field {
            flex: 1 1 180px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .converter-field label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text);
            margin-left: 2px;
        }

        .converter-field input,
        .converter-field select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            outline: none;
            background: #fff;
            color: var(--text);
            transition: all var(--transition);
            font-family: inherit;
        }

        .converter-field input:focus,
        .converter-field select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 110, 247, 0.1);
        }

        .result-area {
            background: #fff;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px;
            text-align: center;
            font-size: 1.1rem;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            word-break: break-word;
        }

        .result-area.success {
            border-color: var(--success);
            background: #f6fff6;
            color: #1a3b1a;
            font-weight: 600;
        }

        .result-area.error {
            border-color: var(--danger);
            background: #fff5f5;
            color: var(--danger);
            font-weight: 600;
        }

        .swap-icon {
            font-size: 1.5rem;
            color: var(--primary);
            cursor: pointer;
            align-self: center;
            padding: 6px;
            border-radius: 50%;
            transition: var(--transition);
            user-select: none;
        }
        .swap-icon:hover {
            background: rgba(79, 110, 247, 0.1);
            transform: rotate(180deg);
        }

        /* ===== CONVERSOR DE MOEDAS ===== */
        .currency-note {
            font-size: 0.75rem;
            color: #999;
            text-align: right;
            margin-top: 4px;
        }

        /* ===== VISUALIZADOR 3D ===== */
        .threed-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .threed-inputs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .threed-inputs .converter-field {
            flex: 1 1 100px;
        }

        .threed-canvas-wrapper {
            background: #1a1a2e;
            border-radius: var(--radius-sm);
            overflow: hidden;
            width: 100%;
            height: 320px;
            position: relative;
        }

        #threeCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .threed-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .threed-controls button {
            padding: 10px 18px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            background: var(--primary);
            color: #fff;
            transition: all var(--transition);
        }
        .threed-controls button:hover {
            background: var(--primary-hover);
        }

        .footer-bar {
            text-align: center;
            padding: 8px;
            font-size: 0.7rem;
            color: #bbb;
            border-top: 1px solid #f0f0f0;
            background: #fafbfc;
        }

        @media (max-width: 450px) {
            .tab-btn {
                font-size: 0.55rem;
                padding: 10px 4px;
            }
            .header h1 {
                font-size: 1.1rem;
            }
            .converter-section {
                flex-direction: column;
            }
            .swap-icon {
                transform: rotate(90deg);
            }
            .swap-icon:hover {
                transform: rotate(270deg);
            }
            .whatsapp-float {
                width: 44px;
                height: 44px;
                top: 14px;
                right: 14px;
            }
            .whatsapp-float svg {
                width: 24px;
                height: 24px;
            }
        }
    </style>
</head>

    <div class="swiss-knife">
        <div class="header">
            <span class="logo-icon">🛠️</span>
            <h1>Canivete Suíço</h1>
            <p>7 ferramentas em um só lugar</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="todo"><span class="tab-icon">📋</span> To-Do</button>
            <button class="tab-btn" data-tab="calculator"><span class="tab-icon">🔢</span> Calculadora</button>
            <button class="tab-btn" data-tab="converter"><span class="tab-icon">🔄</span> Capacitância</button>
            <button class="tab-btn" data-tab="resistance"><span class="tab-icon">⚡</span> Resistência</button>
            <button class="tab-btn" data-tab="measures"><span class="tab-icon">📏</span> Medidas</button>
            <button class="tab-btn" data-tab="currency"><span class="tab-icon">💱</span> Câmbio</button>
            <button class="tab-btn" data-tab="threed"><span class="tab-icon">🧊</span> 3D</button>
        </div>

        <div class="tool-content">
            <!-- To-Do List -->
            <div class="tool-panel active" id="panel-todo">
                <div id="printable-todo">
                    <div class="todo-input-group">
                        <input type="text" id="todoInput" placeholder="O que você precisa fazer?" maxlength="120">
                        <button class="btn-add" id="btnAddTodo">＋</button>
                    </div>
                    <ul class="todo-list" id="todoList"></ul>
                    <div class="export-buttons">
                        <button class="btn-export" id="btnExcel" title="Exportar para Excel">📊 Exportar para Excel</button>
                    </div>
                </div>
            </div>

            <!-- Calculadora -->
            <div class="tool-panel" id="panel-calculator">
                <div class="calculator">
                    <div class="calc-display" id="calcDisplay">0</div>
                    <div class="calc-buttons" id="calcButtons"></div>
                </div>
            </div>

            <!-- Conversor de Capacitância -->
            <div class="tool-panel" id="panel-converter">
                <div class="converter-grid">
                    <div class="converter-row"><label for="pfInput">pF</label><input type="number" id="pfInput" placeholder="Picofarad" step="any"></div>
                    <div class="converter-row"><label for="nfInput">nF</label><input type="number" id="nfInput" placeholder="Nanofarad" step="any"></div>
                    <div class="converter-row"><label for="ufInput">µF</label><input type="number" id="ufInput" placeholder="Microfarad" step="any"></div>
                    <div class="converter-row"><label for="mfInput">mF</label><input type="number" id="mfInput" placeholder="Milifarad" step="any"></div>
                    <div class="converter-row"><label for="fInput">F</label><input type="number" id="fInput" placeholder="Farad" step="any"></div>
                </div>
                <div class="converter-note">Digite qualquer valor → conversão instantânea</div>
            </div>

            <!-- Conversor de Resistência -->
            <div class="tool-panel" id="panel-resistance">
                <div class="converter-grid">
                    <div class="converter-row"><label for="mohmInput">mΩ</label><input type="number" id="mohmInput" placeholder="Miliohm" step="any"></div>
                    <div class="converter-row"><label for="ohmInput">Ω</label><input type="number" id="ohmInput" placeholder="Ohm" step="any"></div>
                    <div class="converter-row"><label for="kohmInput">kΩ</label><input type="number" id="kohmInput" placeholder="Quilohm" step="any"></div>
                    <div class="converter-row"><label for="MohmInput">MΩ</label><input type="number" id="MohmInput" placeholder="Megaohm" step="any"></div>
                    <div class="converter-row"><label for="GohmInput">GΩ</label><input type="number" id="GohmInput" placeholder="Gigaohm" step="any"></div>
                </div>
                <div class="converter-note">Digite qualquer valor → conversão instantânea</div>
            </div>

            <!-- Conversor de Medidas -->
            <div class="tool-panel" id="panel-measures">
                <div class="measure-converter">
                    <div class="converter-section">
                        <div class="converter-field">
                            <label for="measureValue">Valor</label>
                            <input type="number" id="measureValue" placeholder="Digite o valor" step="any">
                        </div>
                        <div class="converter-field">
                            <label for="unitFrom">De</label>
                            <select id="unitFrom"></select>
                        </div>
                        <span class="swap-icon" id="swapUnits" title="Inverter unidades">⇄</span>
                        <div class="converter-field">
                            <label for="unitTo">Para</label>
                            <select id="unitTo"></select>
                        </div>
                    </div>
                    <div class="result-area" id="measureResult">Aguardando valor...</div>
                </div>
            </div>

            <!-- Conversor de Moedas -->
            <div class="tool-panel" id="panel-currency">
                <div class="measure-converter">
                    <div class="converter-section">
                        <div class="converter-field">
                            <label for="currencyValue">Valor</label>
                            <input type="number" id="currencyValue" placeholder="Digite o valor" step="any" value="1">
                        </div>
                        <div class="converter-field">
                            <label for="currencyFrom">De</label>
                            <select id="currencyFrom"></select>
                        </div>
                        <span class="swap-icon" id="swapCurrencies" title="Inverter moedas">⇄</span>
                        <div class="converter-field">
                            <label for="currencyTo">Para</label>
                            <select id="currencyTo"></select>
                        </div>
                    </div>
                    <div class="result-area" id="currencyResult">Carregando taxas de câmbio...</div>
                    <div class="currency-note" id="currencyTimestamp"></div>
                </div>
            </div>

            <!-- Visualizador 3D -->
            <div class="tool-panel" id="panel-threed">
                <div class="threed-container">
                    <div class="threed-inputs">
                        <div class="converter-field">
                            <label for="dimLength">Comprimento (X)</label>
                            <input type="number" id="dimLength" value="2" step="any" min="0.1">
                        </div>
                        <div class="converter-field">
                            <label for="dimHeight">Altura (Y)</label>
                            <input type="number" id="dimHeight" value="1.5" step="any" min="0.1">
                        </div>
                        <div class="converter-field">
                            <label for="dimWidth">Largura (Z)</label>
                            <input type="number" id="dimWidth" value="1" step="any" min="0.1">
                        </div>
                    </div>
                    <div class="threed-canvas-wrapper" id="threedWrapper">
                        <canvas id="threeCanvas"></canvas>
                    </div>
                    <div class="threed-controls">
                        <button id="btnUpdate3D">🔄 Atualizar Dimensões</button>
                        <button id="btnAutoRotate">⏸️ Pausar Rotação</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="footer-bar">💡 Dica: os dados da To-Do List são salvos automaticamente</div>
    </div>

    <!-- Three.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>
    <script>
        (function() {
            // ==================== NAVEGAÇÃO ====================
            const tabBtns = document.querySelectorAll('.tab-btn');
            const panels = document.querySelectorAll('.tool-panel');

            function switchTab(tabName) {
                tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === tabName));
                panels.forEach(p => p.classList.toggle('active', p.id === `panel-${tabName}`));
                if (tabName === 'threed') {
                    setTimeout(() => {
                        initThreeJS();
                        onWindowResize();
                    }, 150);
                }
            }
            tabBtns.forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));

            // ==================== TO-DO LIST ====================
            const todoInput = document.getElementById('todoInput');
            const btnAdd = document.getElementById('btnAddTodo');
            const todoListEl = document.getElementById('todoList');
            const STORAGE_KEY = 'swissTodo';
            let todos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

            function saveTodos() { localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); }

            function renderTodos() {
                todoListEl.innerHTML = '';
                if (!todos.length) {
                    todoListEl.innerHTML =
                        '<li style="text-align:center;padding:40px;color:#aaa;">📝 Nenhuma tarefa ainda.</li>';
                    return;
                }
                const sorted = [...todos].sort((a, b) => (a.completed === b.completed ? 0 : a.completed ? 1 : -1));
                sorted.forEach(todo => {
                    const li = document.createElement('li');
                    li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                    li.dataset.id = todo.id;
                    li.innerHTML = `
                        <input type="checkbox" class="todo-checkbox" ${todo.completed ? 'checked' : ''}>
                        <span class="todo-text">${escapeHtml(todo.text)}</span>
                        <button class="btn-delete">🗑️</button>`;
                    li.querySelector('.todo-checkbox').addEventListener('change', () => toggleTodo(todo.id));
                    li.querySelector('.btn-delete').addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteTodo(todo.id);
                    });
                    li.querySelector('.todo-text').addEventListener('click', () => toggleTodo(todo.id));
                    todoListEl.appendChild(li);
                });
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function addTodo() {
                const text = todoInput.value.trim();
                if (!text) return;
                todos.push({ id: Date.now().toString(), text, completed: false });
                saveTodos();
                renderTodos();
                todoInput.value = '';
                todoInput.focus();
            }

            function toggleTodo(id) {
                const todo = todos.find(t => t.id === id);
                if (todo) {
                    todo.completed = !todo.completed;
                    saveTodos();
                    renderTodos();
                }
            }

            function deleteTodo(id) {
                todos = todos.filter(t => t.id !== id);
                saveTodos();
                renderTodos();
            }

            btnAdd.addEventListener('click', addTodo);
            todoInput.addEventListener('keydown', e => {
                if (e.key === 'Enter') addTodo();
            });
            renderTodos();

            // ==================== EXPORTAÇÃO EXCEL ====================
            document.getElementById('btnExcel').addEventListener('click', () => {
                if (!todos.length) {
                    alert('Nenhuma tarefa para exportar.');
                    return;
                }
                let csvContent = "Status;Tarefa\n";
                todos.forEach(todo => {
                    const status = todo.completed ? "Concluída" : "Pendente";
                    const text = todo.text.replace(/"/g, '""');
                    csvContent += `${status};"${text}"\n`;
                });
                const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'tarefas.csv';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });

            // ==================== CALCULADORA ====================
            const calcDisplay = document.getElementById('calcDisplay');
            const calcButtons = document.getElementById('calcButtons');
            let currentOperand = '0';
            let previousOperand = '';
            let operation = null;
            let shouldResetScreen = false;

            const layout = [
                { label: 'C', type: 'clear' },
                { label: '⌫', type: 'operator', value: 'back' },
                { label: '%', type: 'operator', value: '%' },
                { label: '÷', type: 'operator', value: '/' },
                { label: '7', type: 'number', value: '7' },
                { label: '8', type: 'number', value: '8' },
                { label: '9', type: 'number', value: '9' },
                { label: '×', type: 'operator', value: '*' },
                { label: '4', type: 'number', value: '4' },
                { label: '5', type: 'number', value: '5' },
                { label: '6', type: 'number', value: '6' },
                { label: '−', type: 'operator', value: '-' },
                { label: '1', type: 'number', value: '1' },
                { label: '2', type: 'number', value: '2' },
                { label: '3', type: 'number', value: '3' },
                { label: '+', type: 'operator', value: '+' },
                { label: '0', type: 'number', value: '0', class: 'zero' },
                { label: '.', type: 'number', value: '.' },
                { label: '=', type: 'equal' },
            ];

            layout.forEach(btn => {
                const el = document.createElement('button');
                el.className = `calc-btn ${btn.type}`;
                if (btn.class) el.classList.add(btn.class);
                el.textContent = btn.label;
                el.addEventListener('click', () => handleCalc(btn.value || btn.label));
                calcButtons.appendChild(el);
            });

            function updateCalcDisplay() { calcDisplay.textContent = currentOperand; }

            function handleCalc(value) {
                if (value === 'C') {
                    currentOperand = '0';
                    previousOperand = '';
                    operation = null;
                    shouldResetScreen = false;
                } else if (value === 'back') {
                    if (currentOperand.length === 1 || (currentOperand.length === 2 && currentOperand.startsWith(
                            '-'))) {
                        currentOperand = '0';
                    } else {
                        currentOperand = currentOperand.slice(0, -1);
                    }
                } else if (value === '%') {
                    if (currentOperand === '0') return;
                    currentOperand = (parseFloat(currentOperand) / 100).toString();
                    shouldResetScreen = true;
                } else if (['+', '-', '*', '/'].includes(value)) {
                    if (operation && !shouldResetScreen) {
                        const result = compute(previousOperand, currentOperand, operation);
                        currentOperand = result;
                        previousOperand = result;
                    } else {
                        previousOperand = currentOperand;
                    }
                    operation = value;
                    shouldResetScreen = true;
                } else if (value === '=') {
                    if (operation && !shouldResetScreen) {
                        currentOperand = compute(previousOperand, currentOperand, operation);
                        operation = null;
                        previousOperand = '';
                        shouldResetScreen = true;
                    }
                } else if (value === '.') {
                    if (shouldResetScreen) {
                        currentOperand = '0.';
                        shouldResetScreen = false;
                    } else if (!currentOperand.includes('.')) {
                        currentOperand += '.';
                    }
                } else {
                    if (shouldResetScreen) {
                        currentOperand = value;
                        shouldResetScreen = false;
                    } else {
                        if (currentOperand === '0') currentOperand = value;
                        else currentOperand += value;
                    }
                }
                updateCalcDisplay();
            }

            function compute(a, b, op) {
                const numA = parseFloat(a);
                const numB = parseFloat(b);
                if (isNaN(numA) || isNaN(numB)) return '0';
                let result;
                switch (op) {
                    case '+':
                        result = numA + numB;
                        break;
                    case '-':
                        result = numA - numB;
                        break;
                    case '*':
                        result = numA * numB;
                        break;
                    case '/':
                        result = numB === 0 ? 'Erro' : numA / numB;
                        break;
                    default:
                        return b;
                }
                if (typeof result === 'number') return parseFloat(result.toPrecision(10)).toString();
                return result;
            }

            document.addEventListener('keydown', e => {
                if (!document.getElementById('panel-calculator').classList.contains('active')) return;
                const key = e.key;
                if (key >= '0' && key <= '9') handleCalc(key);
                else if (key === '+') handleCalc('+');
                else if (key === '-') handleCalc('-');
                else if (key === '*') handleCalc('*');
                else if (key === '/') { e.preventDefault();
                    handleCalc('/'); } else if (key === '%') handleCalc('%');
                else if (key === '.') handleCalc('.');
                else if (key === 'Enter' || key === '=') handleCalc('=');
                else if (key === 'Escape' || key === 'c' || key === 'C') handleCalc('C');
                else if (key === 'Backspace') handleCalc('back');
            });

            updateCalcDisplay();

            // ==================== CONVERSOR DE CAPACITÂNCIA ====================
            const pfInput = document.getElementById('pfInput');
            const nfInput = document.getElementById('nfInput');
            const ufInput = document.getElementById('ufInput');
            const mfInput = document.getElementById('mfInput');
            const fInput = document.getElementById('fInput');
            const capInputs = [pfInput, nfInput, ufInput, mfInput, fInput];
            const capFactors = { pf: 1e-12, nf: 1e-9, uf: 1e-6, mf: 1e-3, f: 1 };

            function updateAllFromFarad(farads) {
                if (isNaN(farads) || !isFinite(farads)) {
                    capInputs.forEach(inp => { if (document.activeElement !== inp) inp.value = ''; });
                    return;
                }
                const values = {
                    pf: farads / capFactors.pf,
                    nf: farads / capFactors.nf,
                    uf: farads / capFactors.uf,
                    mf: farads / capFactors.mf,
                    f: farads,
                };
                const focused = document.activeElement;
                if (focused !== pfInput) pfInput.value = formatNumber(values.pf);
                if (focused !== nfInput) nfInput.value = formatNumber(values.nf);
                if (focused !== ufInput) ufInput.value = formatNumber(values.uf);
                if (focused !== mfInput) mfInput.value = formatNumber(values.mf);
                if (focused !== fInput) fInput.value = formatNumber(values.f);
            }

            function formatNumber(num) {
                if (num === 0) return '0';
                if (Math.abs(num) < 1e-15) return '0';
                return parseFloat(num.toPrecision(8)).toString();
            }

            function handleCapInput(source) {
                const raw = source.value.trim();
                if (raw === '') {
                    capInputs.forEach(inp => { if (inp !== source) inp.value = ''; });
                    return;
                }
                const val = parseFloat(raw);
                if (isNaN(val)) return;
                let farads;
                switch (source) {
                    case pfInput:
                        farads = val * capFactors.pf;
                        break;
                    case nfInput:
                        farads = val * capFactors.nf;
                        break;
                    case ufInput:
                        farads = val * capFactors.uf;
                        break;
                    case mfInput:
                        farads = val * capFactors.mf;
                        break;
                    case fInput:
                        farads = val;
                        break;
                }
                updateAllFromFarad(farads);
            }
            capInputs.forEach(inp => inp.addEventListener('input', () => handleCapInput(inp)));

            // ==================== CONVERSOR DE RESISTÊNCIA ====================
            const mohmInput = document.getElementById('mohmInput');
            const ohmInput = document.getElementById('ohmInput');
            const kohmInput = document.getElementById('kohmInput');
            const MohmInput = document.getElementById('MohmInput');
            const GohmInput = document.getElementById('GohmInput');
            const resInputs = [mohmInput, ohmInput, kohmInput, MohmInput, GohmInput];
            const resFactors = { mohm: 0.001, ohm: 1, kohm: 1000, Mohm: 1e6, Gohm: 1e9 };

            function updateAllFromOhm(ohms) {
                if (isNaN(ohms) || !isFinite(ohms)) {
                    resInputs.forEach(inp => { if (document.activeElement !== inp) inp.value = ''; });
                    return;
                }
                const values = {
                    mohm: ohms / resFactors.mohm,
                    ohm: ohms,
                    kohm: ohms / resFactors.kohm,
                    Mohm: ohms / resFactors.Mohm,
                    Gohm: ohms / resFactors.Gohm,
                };
                const focused = document.activeElement;
                if (focused !== mohmInput) mohmInput.value = formatNumber(values.mohm);
                if (focused !== ohmInput) ohmInput.value = formatNumber(values.ohm);
                if (focused !== kohmInput) kohmInput.value = formatNumber(values.kohm);
                if (focused !== MohmInput) MohmInput.value = formatNumber(values.Mohm);
                if (focused !== GohmInput) GohmInput.value = formatNumber(values.Gohm);
            }

            function handleResInput(source) {
                const raw = source.value.trim();
                if (raw === '') {
                    resInputs.forEach(inp => { if (inp !== source) inp.value = ''; });
                    return;
                }
                const val = parseFloat(raw);
                if (isNaN(val)) return;
                let ohms;
                switch (source) {
                    case mohmInput:
                        ohms = val * resFactors.mohm;
                        break;
                    case ohmInput:
                        ohms = val;
                        break;
                    case kohmInput:
                        ohms = val * resFactors.kohm;
                        break;
                    case MohmInput:
                        ohms = val * resFactors.Mohm;
                        break;
                    case GohmInput:
                        ohms = val * resFactors.Gohm;
                        break;
                }
                updateAllFromOhm(ohms);
            }
            resInputs.forEach(inp => inp.addEventListener('input', () => handleResInput(inp)));

            // ==================== CONVERSOR DE MEDIDAS ====================
            const measureValueInput = document.getElementById('measureValue');
            const unitFromSelect = document.getElementById('unitFrom');
            const unitToSelect = document.getElementById('unitTo');
            const swapBtn = document.getElementById('swapUnits');
            const measureResultDiv = document.getElementById('measureResult');

            const unitDefinitions = [
                { symbol: 'm', name: 'Metro (m)', category: 'length', factor: 1 },
                { symbol: 'km', name: 'Quilômetro (km)', category: 'length', factor: 1000 },
                { symbol: 'cm', name: 'Centímetro (cm)', category: 'length', factor: 0.01 },
                { symbol: 'mm', name: 'Milímetro (mm)', category: 'length', factor: 0.001 },
                { symbol: 'in', name: 'Polegada (in)', category: 'length', factor: 0.0254 },
                { symbol: 'ft', name: 'Pé (ft)', category: 'length', factor: 0.3048 },
                { symbol: 'yd', name: 'Jarda (yd)', category: 'length', factor: 0.9144 },
                { symbol: 'mi', name: 'Milha (mi)', category: 'length', factor: 1609.344 },
                { symbol: 'm²', name: 'Metro quadrado (m²)', category: 'area', factor: 1 },
                { symbol: 'km²', name: 'Quilômetro quadrado (km²)', category: 'area', factor: 1e6 },
                { symbol: 'ha', name: 'Hectare (ha)', category: 'area', factor: 10000 },
                { symbol: 'acre', name: 'Acre', category: 'area', factor: 4046.8564224 },
                { symbol: 'ft²', name: 'Pé quadrado (ft²)', category: 'area', factor: 0.09290304 },
                { symbol: 'm³', name: 'Metro cúbico (m³)', category: 'volume', factor: 1 },
                { symbol: 'L', name: 'Litro (L)', category: 'volume', factor: 0.001 },
                { symbol: 'mL', name: 'Mililitro (mL)', category: 'volume', factor: 1e-6 },
                { symbol: 'gal', name: 'Galão (gal)', category: 'volume', factor: 0.00378541 },
                { symbol: 'ft³', name: 'Pé cúbico (ft³)', category: 'volume', factor: 0.0283168 },
                { symbol: 'kg', name: 'Quilograma (kg)', category: 'mass', factor: 1 },
                { symbol: 'g', name: 'Grama (g)', category: 'mass', factor: 0.001 },
                { symbol: 't', name: 'Tonelada (t)', category: 'mass', factor: 1000 },
                { symbol: 'lb', name: 'Libra (lb)', category: 'mass', factor: 0.453592 },
                { symbol: 'oz', name: 'Onça (oz)', category: 'mass', factor: 0.0283495 },
                { symbol: '°C', name: 'Celsius (°C)', category: 'temperature', factor: null },
                { symbol: '°F', name: 'Fahrenheit (°F)', category: 'temperature', factor: null },
                { symbol: 'K', name: 'Kelvin (K)', category: 'temperature', factor: null },
            ];

            function populateUnitSelects() {
                const categories = {
                    length: '📏 Comprimento',
                    area: '📐 Área',
                    volume: '🧪 Volume / Capacidade',
                    mass: '⚖️ Massa',
                    temperature: '🌡️ Temperatura',
                };
                [unitFromSelect, unitToSelect].forEach(select => {
                    select.innerHTML = '';
                    for (const [catKey, catLabel] of Object.entries(categories)) {
                        const optgroup = document.createElement('optgroup');
                        optgroup.label = catLabel;
                        unitDefinitions.filter(u => u.category === catKey).forEach(u => {
                            const option = document.createElement('option');
                            option.value = u.symbol;
                            option.textContent = u.name;
                            optgroup.appendChild(option);
                        });
                        select.appendChild(optgroup);
                    }
                });
                unitFromSelect.value = 'm';
                unitToSelect.value = 'km';
            }
            populateUnitSelects();

            function getUnitDef(symbol) { return unitDefinitions.find(u => u.symbol === symbol); }

            function convertTemperature(value, fromSymbol, toSymbol) {
                let celsius;
                switch (fromSymbol) {
                    case '°C':
                        celsius = value;
                        break;
                    case '°F':
                        celsius = (value - 32) * 5 / 9;
                        break;
                    case 'K':
                        celsius = value - 273.15;
                        break;
                    default:
                        return NaN;
                }
                switch (toSymbol) {
                    case '°C':
                        return celsius;
                    case '°F':
                        return (celsius * 9 / 5) + 32;
                    case 'K':
                        return celsius + 273.15;
                    default:
                        return NaN;
                }
            }

            function performMeasureConversion() {
                const rawValue = measureValueInput.value.trim();
                const fromSymbol = unitFromSelect.value;
                const toSymbol = unitToSelect.value;
                measureResultDiv.className = 'result-area';
                measureResultDiv.textContent = 'Aguardando valor...';
                if (rawValue === '') return;
                const value = parseFloat(rawValue);
                if (isNaN(value)) {
                    measureResultDiv.textContent = '⚠️ Valor numérico inválido';
                    measureResultDiv.classList.add('error');
                    return;
                }
                const fromDef = getUnitDef(fromSymbol);
                const toDef = getUnitDef(toSymbol);
                if (!fromDef || !toDef) {
                    measureResultDiv.textContent = '⚠️ Unidade não reconhecida';
                    measureResultDiv.classList.add('error');
                    return;
                }
                if (fromDef.category !== toDef.category) {
                    measureResultDiv.textContent =
                        `❌ Conversão não suportada: "${fromDef.name}" e "${toDef.name}" são grandezas diferentes.`;
                    measureResultDiv.classList.add('error');
                    return;
                }
                let result;
                if (fromDef.category === 'temperature') {
                    result = convertTemperature(value, fromSymbol, toSymbol);
                    if (isNaN(result)) {
                        measureResultDiv.textContent = '⚠️ Erro na conversão de temperatura';
                        measureResultDiv.classList.add('error');
                        return;
                    }
                } else {
                    result = (value * fromDef.factor) / toDef.factor;
                }
                measureResultDiv.textContent =
                    `${formatNumber(value)} ${fromSymbol} = ${formatNumber(parseFloat(result.toPrecision(10)))} ${toSymbol}`;
                measureResultDiv.classList.add('success');
            }
            measureValueInput.addEventListener('input', performMeasureConversion);
            unitFromSelect.addEventListener('change', performMeasureConversion);
            unitToSelect.addEventListener('change', performMeasureConversion);
            swapBtn.addEventListener('click', () => {
                const temp = unitFromSelect.value;
                unitFromSelect.value = unitToSelect.value;
                unitToSelect.value = temp;
                performMeasureConversion();
            });

            // ==================== CONVERSOR DE MOEDAS ====================
            const currencyValueInput = document.getElementById('currencyValue');
            const currencyFromSelect = document.getElementById('currencyFrom');
            const currencyToSelect = document.getElementById('currencyTo');
            const swapCurrenciesBtn = document.getElementById('swapCurrencies');
            const currencyResultDiv = document.getElementById('currencyResult');
            const currencyTimestamp = document.getElementById('currencyTimestamp');
            let allCurrencies = [
                { code: 'USD', name: 'Dólar Americano' },
                { code: 'EUR', name: 'Euro' },
                { code: 'BRL', name: 'Real Brasileiro' },
                { code: 'GBP', name: 'Libra Esterlina' },
                { code: 'JPY', name: 'Iene Japonês' },
                { code: 'CHF', name: 'Franco Suíço' },
                { code: 'CAD', name: 'Dólar Canadense' },
                { code: 'AUD', name: 'Dólar Australiano' },
                { code: 'CNY', name: 'Yuan Chinês' },
                { code: 'ARS', name: 'Peso Argentino' },
            ];
            let ratesCache = null;
            let ratesDate = null;
            let conversionTimeout = null;

            async function loadCurrencyData() {
                try {
                    currencyResultDiv.className = 'result-area';
                    currencyResultDiv.textContent = 'Carregando moedas...';
                    const [currenciesRes, ratesRes] = await Promise.all([
                        fetch('https://api.frankfurter.dev/v2/currencies'),
                        fetch('https://api.frankfurter.dev/v2/latest?base=USD')
                    ]);
                    if (!currenciesRes.ok || !ratesRes.ok) throw new Error('Falha na API');
                    const currenciesData = await currenciesRes.json();
                    const ratesData = await ratesRes.json();
                    allCurrencies = currenciesData.filter(c => c.iso_code && c.name).map(c => ({ code: c.iso_code,
                        name: c.name })).sort((a, b) => a.code.localeCompare(b.code));
                    const popularCodes = ['USD', 'EUR', 'BRL', 'GBP', 'JPY', 'CHF', 'CAD', 'AUD', 'CNY', 'ARS'];
                    const popular = [],
                        rest = [];
                    allCurrencies.forEach(c => popularCodes.includes(c.code) ? popular.push(c) : rest.push(c));
                    allCurrencies = [...popular.sort((a, b) => popularCodes.indexOf(a.code) - popularCodes.indexOf(b
                        .code)), ...rest];
                    ratesCache = ratesData.rates;
                    ratesDate = ratesData.date;
                    populateCurrencySelects();
                    currencyFromSelect.value = 'USD';
                    currencyToSelect.value = 'BRL';
                    currencyResultDiv.textContent = 'Aguardando valor...';
                    currencyTimestamp.textContent = `Taxas de: ${ratesDate}`;
                    performCurrencyConversion();
                } catch (error) {
                    currencyResultDiv.textContent = '⚠️ Erro ao carregar taxas de câmbio.';
                    currencyResultDiv.classList.add('error');
                    populateCurrencySelects();
                }
            }

            function populateCurrencySelects() {
                [currencyFromSelect, currencyToSelect].forEach(select => {
                    select.innerHTML = '';
                    allCurrencies.forEach(c => {
                        const option = document.createElement('option');
                        option.value = c.code;
                        option.textContent = `${c.code} - ${c.name}`;
                        select.appendChild(option);
                    });
                });
            }

            async function performCurrencyConversion() {
                const rawValue = currencyValueInput.value.trim();
                const fromCode = currencyFromSelect.value;
                const toCode = currencyToSelect.value;
                currencyResultDiv.className = 'result-area';
                if (rawValue === '') { currencyResultDiv.textContent = 'Aguardando valor...'; return; }
                const value = parseFloat(rawValue);
                if (isNaN(value) || value < 0) {
                    currencyResultDiv.textContent = '⚠️ Valor numérico inválido';
                    currencyResultDiv.classList.add('error');
                    return;
                }
                if (!ratesCache) { currencyResultDiv.textContent = '⏳ Carregando taxas...'; return; }
                if (fromCode === toCode) {
                    currencyResultDiv.textContent =
                        `${formatCurrencyValue(value)} ${fromCode} = ${formatCurrencyValue(value)} ${toCode}`;
                    currencyResultDiv.classList.add('success');
                    return;
                }
                try {
                    let rate;
                    if (fromCode !== 'USD') {
                        const resp = await fetch(
                            `https://api.frankfurter.dev/v2/latest?base=${fromCode}&symbols=${toCode}`);
                        if (!resp.ok) throw new Error('Falha na API');
                        const data = await resp.json();
                        rate = data.rates[toCode];
                    } else {
                        rate = ratesCache[toCode];
                        if (!rate) {
                            const resp = await fetch(
                                `https://api.frankfurter.dev/v2/latest?base=USD&symbols=${toCode}`);
                            if (!resp.ok) throw new Error('Falha na API');
                            const data = await resp.json();
                            rate = data.rates[toCode];
                            if (rate) ratesCache[toCode] = rate;
                        }
                    }
                    if (!rate) throw new Error('Taxa não encontrada');
                    const converted = value * rate;
                    currencyResultDiv.textContent =
                        `${formatCurrencyValue(value)} ${fromCode} = ${formatCurrencyValue(converted)} ${toCode}`;
                    currencyResultDiv.classList.add('success');
                    currencyTimestamp.textContent =
                        `1 ${fromCode} = ${formatCurrencyValue(rate)} ${toCode} | Taxas de: ${ratesDate || 'hoje'}`;
                } catch (e) {
                    currencyResultDiv.textContent = '⚠️ Erro ao obter taxa de câmbio.';
                    currencyResultDiv.classList.add('error');
                }
            }

            function formatCurrencyValue(num) {
                if (num === 0) return '0.00';
                if (Math.abs(num) < 0.01) return num.toFixed(6);
                if (Math.abs(num) >= 1000) return num.toLocaleString('pt-BR', { minimumFractionDigits: 2,
                    maximumFractionDigits: 2 });
                return num.toFixed(2);
            }
            currencyValueInput.addEventListener('input', () => {
                clearTimeout(conversionTimeout);
                conversionTimeout = setTimeout(performCurrencyConversion, 300);
            });
            currencyFromSelect.addEventListener('change', performCurrencyConversion);
            currencyToSelect.addEventListener('change', performCurrencyConversion);
            swapCurrenciesBtn.addEventListener('click', () => {
                const temp = currencyFromSelect.value;
                currencyFromSelect.value = currencyToSelect.value;
                currencyToSelect.value = temp;
                performCurrencyConversion();
            });
            let currenciesLoaded = false;
            const originalSwitchTab = switchTab;
            switchTab = function(tabName) {
                originalSwitchTab(tabName);
                if (tabName === 'currency' && !currenciesLoaded) {
                    currenciesLoaded = true;
                    loadCurrencyData();
                }
                if (tabName === 'threed') {
                    setTimeout(() => {
                        initThreeJS();
                        onWindowResize();
                    }, 200);
                }
            };

            // ==================== VISUALIZADOR 3D (CORRIGIDO) ====================
            let threeScene, threeCamera, threeRenderer, threeCube, threeInitialized = false;
            let autoRotate = true;
            let animationId = null;

            function initThreeJS() {
                if (threeInitialized) {
                    onWindowResize();
                    return;
                }
                const canvas = document.getElementById('threeCanvas');
                if (!canvas) return;
                const wrapper = document.getElementById('threedWrapper');
                if (!wrapper) return;
                const width = wrapper.clientWidth || 400;
                const height = wrapper.clientHeight || 320;

                // Garante que o canvas tenha tamanho
                canvas.width = width;
                canvas.height = height;

                threeScene = new THREE.Scene();
                threeScene.background = new THREE.Color(0x1a1a2e);

                threeCamera = new THREE.PerspectiveCamera(45, width / Math.max(height, 1), 0.1, 100);
                threeCamera.position.set(4, 3, 5);
                threeCamera.lookAt(0, 0, 0);

                threeRenderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
                threeRenderer.setSize(width, height);
                threeRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                threeRenderer.shadowMap.enabled = true;

                // Iluminação
                const ambientLight = new THREE.AmbientLight(0x404060);
                threeScene.add(ambientLight);
                const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
                directionalLight.position.set(5, 10, 5);
                directionalLight.castShadow = true;
                threeScene.add(directionalLight);
                const backLight = new THREE.DirectionalLight(0x8888ff, 0.5);
                backLight.position.set(-3, -1, -3);
                threeScene.add(backLight);

                // Grid
                const gridHelper = new THREE.GridHelper(6, 20, 0x444466, 0x222244);
                threeScene.add(gridHelper);

                // Cria cuboide inicial
                updateCubeDimensions();

                // Controles de mouse
                let isDragging = false,
                    previousMouse = { x: 0, y: 0 };
                canvas.addEventListener('mousedown', e => { isDragging = true;
                    previousMouse = { x: e.clientX, y: e.clientY }; });
                canvas.addEventListener('mousemove', e => {
                    if (!isDragging) return;
                    const deltaX = e.clientX - previousMouse.x;
                    const deltaY = e.clientY - previousMouse.y;
                    threeCamera.position.x += deltaX * 0.01;
                    threeCamera.position.y -= deltaY * 0.01;
                    threeCamera.lookAt(0, 0, 0);
                    previousMouse = { x: e.clientX, y: e.clientY };
                });
                canvas.addEventListener('mouseup', () => { isDragging = false; });
                canvas.addEventListener('mouseleave', () => { isDragging = false; });
                canvas.addEventListener('wheel', e => {
                    e.preventDefault();
                    const direction = new THREE.Vector3().subVectors(threeCamera.position, new THREE.Vector3(0, 0,
                        0)).normalize();
                    threeCamera.position.addScaledVector(direction, e.deltaY * 0.005);
                    if (threeCamera.position.length() < 1.5) threeCamera.position.setLength(1.5);
                    if (threeCamera.position.length() > 12) threeCamera.position.setLength(12);
                });

                threeInitialized = true;
                if (animationId) cancelAnimationFrame(animationId);
                animate();
            }

            function updateCubeDimensions() {
                if (!threeScene) return;
                const length = parseFloat(document.getElementById('dimLength').value) || 2;
                const height = parseFloat(document.getElementById('dimHeight').value) || 1.5;
                const width = parseFloat(document.getElementById('dimWidth').value) || 1;

                // Remove cubo anterior
                if (threeCube) {
                    threeScene.remove(threeCube);
                    if (threeCube.geometry) threeCube.geometry.dispose();
                    if (threeCube.material) threeCube.material.dispose();
                }

                // Geometria do paralelepípedo
                const geometry = new THREE.BoxGeometry(length, height, width);
                const material = new THREE.MeshPhongMaterial({
                    color: 0x4f6ef7,
                    emissive: 0x111133,
                    shininess: 60,
                    transparent: true,
                    opacity: 0.9,
                });
                threeCube = new THREE.Mesh(geometry, material);
                threeCube.castShadow = true;

                // Arestas (wireframe sobreposto)
                const edges = new THREE.EdgesGeometry(geometry);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xaaccff }));
                threeCube.add(line);

                threeScene.add(threeCube);

                // Ajusta posição da câmera
                const maxDim = Math.max(length, height, width);
                const camDist = maxDim * 2.5;
                threeCamera.position.set(camDist * 0.7, camDist * 0.6, camDist * 0.8);
                threeCamera.lookAt(0, 0, 0);
            }

            function animate() {
                animationId = requestAnimationFrame(animate);
                if (threeCube && autoRotate) {
                    threeCube.rotation.y += 0.008;
                }
                if (threeRenderer && threeScene && threeCamera) {
                    threeRenderer.render(threeScene, threeCamera);
                }
            }

            function onWindowResize() {
                const canvas = document.getElementById('threeCanvas');
                const wrapper = document.getElementById('threedWrapper');
                if (!canvas || !wrapper || !threeRenderer || !threeCamera) return;
                const width = wrapper.clientWidth;
                const height = wrapper.clientHeight;
                if (width === 0 || height === 0) return;
                threeRenderer.setSize(width, height);
                threeCamera.aspect = width / Math.max(height, 1);
                threeCamera.updateProjectionMatrix();
            }

            window.addEventListener('resize', onWindowResize);

            document.getElementById('btnUpdate3D').addEventListener('click', () => {
                if (!threeInitialized) initThreeJS();
                updateCubeDimensions();
                onWindowResize();
            });

            document.getElementById('btnAutoRotate').addEventListener('click', function() {
                autoRotate = !autoRotate;
                this.textContent = autoRotate ? '⏸️ Pausar Rotação' : '▶️ Auto Rotação';
            });

            // Inicializa conversores com 0
            updateAllFromFarad(0);
            updateAllFromOhm(0);

            console.log('🛠️ Canivete Suíço pronto!');
            console.log('📋 To-Do | 🔢 Calc | 🔄 Cap | ⚡ Res | 📏 Med | 💱 Câmbio | 🧊 3D');
            console.log('💬 WhatsApp: 55 35 98406-7208');
        })();
    </script>
</body>
